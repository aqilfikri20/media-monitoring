services:

  frontend:
    build:
      context: ./frontend
    container_name: media-monitoring-frontend
    ports:
      - "8080:80"

  backend:
    build:
      context: ./backend
    container_name: media-monitoring-backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/media_monitoring
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: media-monitoring-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: media_monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d media_monitoring"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: